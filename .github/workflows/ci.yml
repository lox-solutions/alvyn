name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:coverage
      - name: Save PR number and coverage summary
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p pr-data
          echo "${{ github.event.pull_request.number }}" > pr-data/pr-number.txt
          cp coverage/coverage-summary.json pr-data/

      - name: Upload PR data artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-data
          path: pr-data/
      - run: pnpm run audit:prod
      - run: pnpm run pack:check
      - run: pnpm --filter website run types:check
      - run: pnpm --filter website run build
